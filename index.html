<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Handy: Seite nicht verkleinern, bis unter die Notch nutzen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CHEV Anwesenheit</title>
  <!-- Farbe der Browserleiste und Symbol für "Zum Startbildschirm" -->
  <meta name="theme-color" content="#1E5AFF">
  <meta name="apple-mobile-web-app-title" content="CHEV">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #1E5AFF; }
    /* Die App füllt den ganzen Bildschirm */
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Hier wird die App aus Google Apps Script angezeigt -->
  <iframe src="https://script.google.com/macros/s/AKfycbxQl4XM8Qbeo_zzB3xYETs-0Jf-WFLVq2k0osQ_LP98PnxHzhaauW7Ej7P79ibXSLYu/exec"
          title="CHEV Anwesenheit" allow="clipboard-write"></iframe>

  <script>
    // Die App (bei Google) darf ihre Anmeldung hier aufbewahren lassen,
    // weil der Browser den Speicher der eingebetteten App oft löscht.
    const ERLAUBTE_NAMEN = ['chevToken', 'chevLoginEmail'];

    window.addEventListener('message', function (ereignis) {
      // Nur Nachrichten von der Google-Apps-Script-App annehmen
      if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(ereignis.origin)) {
        return;
      }
      const d = ereignis.data;
      if (!d || typeof d !== 'object' || !ERLAUBTE_NAMEN.includes(d.name)) {
        return;
      }
      try {
        if (d.chev === 'merke') {
          localStorage.setItem(d.name, String(d.wert));
        } else if (d.chev === 'vergiss') {
          localStorage.removeItem(d.name);
        } else if (d.chev === 'frage') {
          const wert = localStorage.getItem(d.name) || '';
          ereignis.source.postMessage({ chev: 'antwort', name: d.name, wert: wert }, ereignis.origin);
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
